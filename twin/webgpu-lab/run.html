<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ריצת מדידה</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1d2228;color:#fff;font-family:system-ui,Arial,sans-serif}#cv{position:fixed;inset:0;width:100%;height:100%}
#tag{position:fixed;top:8px;right:8px;padding:5px 9px;border-radius:9px;font-weight:700;direction:ltr;background:#334155}#msg{position:fixed;bottom:10px;right:10px;left:10px;text-align:center;font-size:14px;background:#0009;border-radius:8px;padding:6px}</style>
</head>
<body>
<canvas id="cv"></canvas><div id="tag">…</div><div id="msg">טוען…</div>
<script type="module">
// דף ריצה בודד: נטען בתוך iframe של bench.html, מודד ושולח תוצאה להורה. אפשר גם לפתוח ישירות.
import { startLab } from './js/lab.js';
const qs = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const mode = qs.get('mode') || 'webgpu', demo = qs.get('demo') || 'all', warm = +(qs.get('warm') || 3), secs = +(qs.get('secs') || 8), soak = +(qs.get('soak') || 0);
const post = m => { m.run = qs.get('run') || ''; if (m.type !== 'soak') window.__result = m; (parent !== window ? parent : window).postMessage(m, '*'); if (parent === window) $('msg').textContent = JSON.stringify(m).slice(0, 400); };
const D = { city: true, crowd: demo === 'crowd' || demo === 'all', trees: demo === 'crowd' || demo === 'all', rain: demo === 'rain' || demo === 'all' };
const t0 = performance.now();
let lab;
addEventListener('error', e => post({ type: 'error', msg: String(e.message || e).slice(0, 300) }));
addEventListener('unhandledrejection', e => post({ type: 'error', msg: String(e.reason && e.reason.message || e.reason).slice(0, 300) }));
try {
  const data = qs.get('data') === 'none' ? null : (qs.get('data') || null);
  lab = await startLab({ canvas: $('cv'), mode, ...D, dpr: +(qs.get('dpr') || 1), cam: 'auto', data, onStatus: s => $('msg').textContent = s,
    counts: { walkers: +(qs.get('walkers') || 20000), trees: +(qs.get('trees') || 20000), rain: +(qs.get('rain') || 200000) } });
  $('tag').textContent = lab.backend === 'WebGL-classic' ? 'WebGL קלאסי' : lab.backend; $('tag').style.background = lab.backend === 'WebGPU' ? '#16a34a' : lab.backend === 'WebGL2' ? '#f59e0b' : '#64748b';
  const loadMs = performance.now() - t0;
  // פריים ראשון אמיתי
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const firstMs = performance.now() - t0;
  $('msg').textContent = `חימום ${warm} שנ'…`; await new Promise(r => setTimeout(r, warm * 1000));
  const base = { type: 'result', mode, demo, backend: lab.backend, adapter: lab.adapterInfo, city: lab.city, counts: lab.counts, loadMs: Math.round(loadMs), firstMs: Math.round(firstMs) };
  if (soak) {
    const per = [];
    for (let m = 0; m < Math.ceil(soak / 60); m++) { lab.resetStats(); for (let s = 0; s < 60; s++) { await new Promise(r => setTimeout(r, 1000)); $('msg').textContent = `יציבות: דקה ${m + 1}/${Math.ceil(soak / 60)} · ${s + 1} שנ'`; }
      const st = lab.stats(); per.push({ min: m + 1, fps: +st.fps.toFixed(1), p95: +st.p95.toFixed(1), long: st.long }); post({ type: 'soak', minute: m + 1, ...per[per.length - 1], errors: lab.errors.slice(0, 3) }); }
    post({ ...base, type: 'soakdone', per, errors: lab.errors.slice(0, 5) });
  } else {
    lab.resetStats(); $('msg').textContent = `מודד ${secs} שנ'…`; await new Promise(r => setTimeout(r, secs * 1000));
    const st = lab.stats();
    post({ ...base, stats: st, vis: lab.visibleWalkers(), errors: lab.errors.slice(0, 5) });
  }
  $('msg').textContent = 'סיום';
  if (parent !== window) lab.stop();
} catch (e) { post({ type: 'error', mode, demo, msg: String(e && e.message || e).slice(0, 300) }); $('msg').textContent = 'שגיאה: ' + (e && e.message || e); }
</script>
</body>
</html>
