<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>מעבדת WebGPU · לוח היזם</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1d2228;font-family:system-ui,"Segoe UI",Arial,sans-serif;color:#eef}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;top:8px;right:8px;left:8px;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
  .badge{pointer-events:auto;padding:6px 10px;border-radius:10px;font-weight:700;font-size:15px;direction:ltr;box-shadow:0 2px 8px #0006}
  .b-webgpu{background:#16a34a;color:#fff}.b-webgl2{background:#f59e0b;color:#111}.b-classic{background:#64748b;color:#fff}.b-wait{background:#334155}
  #fps{background:#0f172acc;padding:6px 9px;border-radius:10px;font-size:13px;line-height:1.35;white-space:pre;direction:rtl}
  #bar{position:fixed;bottom:0;right:0;left:0;background:#0f172ae6;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  #bar button{font:inherit;font-size:14px;border:0;border-radius:9px;padding:8px 10px;background:#334155;color:#fff}
  #bar button.on{background:#2563eb}
  #st{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#0f172ae6;padding:12px 16px;border-radius:12px;font-size:15px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><div id="badge" class="badge b-wait">…</div><div id="fps"></div></div>
<div id="st">מאתחל…</div>
<div id="bar"></div>
<script type="module">
import { startLab } from './js/lab.js';
const qs = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const mode = qs.get('mode') || 'webgpu', demo = qs.get('demo') || 'city';
const D = { city: demo === 'city' || demo === 'all' || demo === 'crowd' || demo === 'rain' || demo === 'trees', crowd: demo === 'crowd' || demo === 'all', trees: demo === 'trees' || demo === 'all' || demo === 'crowd', rain: demo === 'rain' || demo === 'all' };
if (qs.get('nocity') === '1') D.city = false;
// בסיס נתונים: פרמטר data, אחרת מחפשים ליד הדף (data/ או ../pipeline/sample-out-ashdod/), אחרת מהמאגר הציבורי, אחרת עיר פרוצדורלית
async function findData() {
  if (qs.get('data') === 'none') return null;
  const c = [qs.get('data'), 'data/', '../pipeline/sample-out-ashdod/', 'https://raw.githack.com/ArielSivkov/codesandbox-template-nuxt/twin-world/twin/pipeline/sample-out-ashdod/'].filter(Boolean);
  for (const b of c) { try { const r = await fetch(b + 'index.json', { cache: 'no-store' }); if (r.ok && (await r.json()).cities) return b; } catch (e) {} }
  return null;
}
const MODES = [['webgpu', 'WebGPU (אוטומטי)'], ['webgl2', 'WebGL2 (אותו קוד)'], ['classic', 'קלאסי']], DEMOS = [['city', 'עיר'], ['crowd', 'הולכי רגל ועצים'], ['rain', 'גשם'], ['all', 'הכול']];
const go = (k, v) => { qs.set(k, v); location.search = qs.toString(); };
$('bar').innerHTML = MODES.map(([k, t]) => `<button data-m="${k}" class="${k === mode ? 'on' : ''}">${t}</button>`).join('') + '<span style="width:8px"></span>' + DEMOS.map(([k, t]) => `<button data-d="${k}" class="${k === demo ? 'on' : ''}">${t}</button>`).join('');
$('bar').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.m) go('mode', b.dataset.m); if (b.dataset.d) go('demo', b.dataset.d); };
let lab;
try {
  const data = await findData();
  lab = await startLab({ canvas: $('cv'), mode, ...D, dpr: +(qs.get('dpr') || Math.min(devicePixelRatio || 1, 1.5)), cam: qs.get('cam') || 'orbit', data, cull: qs.get('cull') !== '0',
    camPreset: qs.get('view') || null, counts: { walkers: +(qs.get('walkers') || 20000), trees: +(qs.get('trees') || 20000), rain: +(qs.get('rain') || 200000) }, onStatus: s => $('st').textContent = s });
  $('st').style.display = 'none';
  const b = $('badge'); b.textContent = lab.backend === 'WebGL-classic' ? 'WebGL (קלאסי)' : lab.backend; b.className = 'badge ' + (lab.backend === 'WebGPU' ? 'b-webgpu' : lab.backend === 'WebGL2' ? 'b-webgl2' : 'b-classic');
  window.__lab = lab;
  setInterval(() => { const s = lab.stats(1000); const v = lab.visibleWalkers();
    $('fps').textContent = `${s.fps.toFixed(1)} FPS · ${s.p50.toFixed(1)} מ"ש (p95 ${s.p95.toFixed(1)})\nמעבד לפריים ${s.cpu50.toFixed(2)} מ"ש · קריאות ${s.calls}\nעיר: ${lab.city.tiles} אריחים, ${lab.city.buildings} בניינים (${lab.city.source === 'ashdod' ? 'אשדוד' : 'פרוצדורלית'})` +
      (lab.counts.walkers ? `\nהולכי רגל ${lab.counts.walkers.toLocaleString()} · ${lab.counts.crowdSim === 'gpu-compute' ? 'חישוב ב-GPU' : 'חישוב במעבד'}` + (v != null ? ` · נראים ${v}` : '') : '') +
      (lab.counts.trees ? `\nעצים ${lab.counts.trees.toLocaleString()}` : '') + (lab.counts.rain ? `\nגשם ${lab.counts.rain.toLocaleString()} · ${lab.counts.rainSim === 'gpu-compute' ? 'חישוב ב-GPU' : 'חישוב במעבד'}` : '') +
      (lab.errors.length ? `\nשגיאות: ${lab.errors.length}` : ''); }, 1000);
} catch (e) { $('st').textContent = 'שגיאה: ' + (e && e.message || e); console.error(e); window.__labErr = String(e && e.stack || e); }
</script>
</body>
</html>
