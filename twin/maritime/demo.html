<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>המחלקה הימית · אשדוד – ים, נמל, מרינה ומצב סירה</title>
<style>
:root{--fg:#f4f6f8;--panel:rgba(18,24,32,.62);--line:rgba(255,255,255,.18);--acc:#f2b84b}
html,body{margin:0;height:100%;overflow:hidden;background:#9fb9cf;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--fg);-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
.btn{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 11px;cursor:pointer;min-height:38px;white-space:nowrap;backdrop-filter:blur(4px)}
.btn.on{border-color:var(--acc);color:var(--acc)}
#top{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:9;pointer-events:none}
#top .btn{pointer-events:auto}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 54px);right:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 10px;font-size:13px;z-index:8;display:flex;gap:10px;align-items:center}
#hud b{font-size:17px}
#labels{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 4px);left:50%;transform:translateX(-50%);max-width:min(520px,56vw);background:rgba(10,14,20,.5);border-radius:9px;padding:3px 8px;font-size:10px;line-height:1.3;z-index:7;cursor:pointer}
#labels .more{display:none}#labels.open .more{display:block}#labels.open{max-height:70vh;overflow:auto}
#labels div{white-space:normal}
#perf{position:fixed;top:calc(env(safe-area-inset-top) + 54px);left:8px;background:var(--panel);border-radius:10px;padding:3px 8px;font-size:11px;z-index:8;direction:ltr}
#joy{position:fixed;left:calc(env(safe-area-inset-left) + 18px);bottom:calc(env(safe-area-inset-bottom) + 22px);width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);z-index:9;touch-action:none}
#joy i{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 2px 8px #0006}
#acts{position:fixed;right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 22px);display:flex;gap:12px;z-index:9;align-items:flex-end}
.ab{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);color:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
.ab span{font-size:18px;line-height:1}.ab b{font-size:10px;font-weight:600}
.ab.hold{background:rgba(242,184,75,.45)}
@media (max-height:420px){ #joy{width:116px;height:116px} #joy i{left:33px;top:33px} .ab{width:56px;height:56px} }
body.desk #joy,body.desk #acts{display:none}
body.shot #perf{display:none}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0e1720;z-index:20;font-size:15px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <button class="btn on" id="mBoat">🚤 סירה</button>
  <button class="btn" id="mView">🎥 מבט חופשי</button>
  <button class="btn" id="bAis">📡 AIS לדוגמה</button>
  <button class="btn" id="bTime">🌅 שקיעה</button>
</div>
<div id="hud"><span><b id="hSpd">0</b> קשר</span><span id="hKmh">0 קמ״ש</span><span id="hPlane"></span></div>
<div id="perf"></div>
<div id="labels"></div>
<div id="joy"><i></i></div>
<div id="acts"><button class="ab" id="bB"><span>◀</span><b>אחורה</b></button><button class="ab" id="bA"><span>▲</span><b>טורבו</b></button></div>
<div id="load">טוען את אשדוד והים…</div>
<script src="vendor/three.min.js"></script>
<script>
  // world.js of the game team (read-only use): terrain, buildings, roads of the Ashdod sample
  window.TWIN = new URLSearchParams(location.search).get('twin') || '../../codesandbox-template-nuxt/twin/game/';
  document.write('<script src="' + window.TWIN + 'js/world.js"><\/script>');
</script>
<script type="module" src="demo.js"></script>
</body>
</html>
