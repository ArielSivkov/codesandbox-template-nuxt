<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1420">
<title>27wrld · מחלקת התעופה והחלל — מטוס קרב וחללית (הדגמה)</title>
<style>
html,body{margin:0;height:100%;background:#0d1420;color:#eef3f8;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#modeBar{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:calc(env(safe-area-inset-right) + 8px);z-index:41;display:flex;gap:5px}
#modeBar button{font:inherit;font-size:12px;font-weight:700;color:#fff;background:rgba(12,20,32,.75);border:2px solid rgba(255,255,255,.25);border-radius:11px;padding:4px 9px;cursor:pointer;height:32px}
#modeBar button.on{border-color:#f2b84b;color:#f2b84b}
#scn{position:fixed;top:calc(env(safe-area-inset-top) + 42px);right:calc(env(safe-area-inset-right) + 8px);z-index:41;display:none;flex-direction:column;gap:4px;background:rgba(12,20,32,.85);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:6px}
#scn.open{display:flex}
#scn button{font:inherit;font-size:11px;color:#cfe;background:rgba(12,20,32,.6);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:3px 7px;cursor:pointer}
#perf{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom) + 156px);z-index:41;font:10px ui-monospace,monospace;color:#fff;text-shadow:0 1px 2px #000;direction:ltr;white-space:pre;pointer-events:none}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d1420;z-index:60;font-size:15px;flex-direction:column;gap:8px}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:50;background:#1d2a3d;border:1px solid #f2b84b;border-radius:10px;padding:7px 13px;font-size:14px;display:none;max-width:80vw;text-align:center}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="load"><b>מחלקת התעופה והחלל · 27wrld</b><span id="loadT">טוען את העולם…</span></div>
<div id="modeBar"><button id="mJet" class="on">✈ מטוס קרב</button><button id="mShip">🚀 חללית</button><button id="mScn">☰</button></div>
<div id="scn"></div>
<div id="perf"></div>
<div id="toast"></div>
<script src="vendor/three.min.js"></script>
<!-- the game's city (optional): served next to this folder as in /home/claude; ?city=0 to skip -->
<script>
  window.CITY_BASE = new URLSearchParams(location.search).get('cityBase') || '../../codesandbox-template-nuxt/twin/game/';
  if (new URLSearchParams(location.search).get('city') !== '0') document.write('<script src="' + window.CITY_BASE + 'js/world.js"><\/script>');
</script>
<script type="module" src="demo.js"></script>
</body>
</html>
