<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>עולם תאום – שמיים וזמן (ESH27)</title>
<style>
  :root { --bg: #0b1020; --panel: rgba(12,18,34,.94); --line: rgba(160,180,220,.22); --text: #e8ecf6; --dim: #9aa6c2; --acc: #ffcf6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, "Segoe UI", Arial, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lb { position: absolute; transform: translate(-50%, -140%); font-size: 11px; white-space: nowrap; color: #dfe6ff; text-shadow: 0 0 3px #000, 0 0 6px #000; }
  .lb.pl { color: #ffe3a3; font-weight: 600; } .lb.mn { color: #fff; font-weight: 700; } .lb.sn { color: #ffd45e; font-weight: 700; } .lb.card { color: #9fd0ff; font-weight: 700; font-size: 13px; transform: translate(-50%, -50%); }
  #top { position: fixed; top: 0; inset-inline: 0; padding: 6px 8px calc(6px); background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; z-index: 3; }
  #top select, #top input, button { background: #18223d; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; font: inherit; }
  #top input[type=number] { width: 64px; } #top #yy { width: 78px; } #preset { max-width: 44vw; } #top label { color: var(--dim); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  #timebar { position: fixed; bottom: 0; inset-inline: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); z-index: 3; }
  #timebar .row { display: flex; gap: 8px; align-items: center; }
  #slider { flex: 1; accent-color: var(--acc); }
  #clock { font-variant-numeric: tabular-nums; min-width: 92px; text-align: center; font-weight: 700; }
  #sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  #panel { position: fixed; inset-inline-start: 8px; top: var(--topH, 92px); width: min(380px, calc(100vw - 16px)); max-height: calc(100vh - var(--topH, 92px) - 80px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; z-index: 2; }
  #panel.min .body { display: none; }
  @media (max-width: 700px) { #panel { top: auto; bottom: 74px; max-height: 42vh; } #top { gap: 4px; padding: 4px 6px; } #top input[type=number] { width: 50px; } #top #yy { width: 70px; } }
  #tabs { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #0f1730; }
  #tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 8px 4px; color: var(--dim); }
  #tabs button.on { color: var(--acc); box-shadow: inset 0 -2px 0 var(--acc); }
  .body { padding: 8px 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; } td, th { padding: 3px 4px; border-bottom: 1px solid var(--line); text-align: start; }
  td.n { direction: ltr; text-align: end; font-variant-numeric: tabular-nums; }
  .note { color: var(--dim); font-size: 11.5px; margin: 6px 0; }
  .warn { color: #ffb38a; } .ok { color: #9be39b; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .grid label { display: flex; flex-direction: column; font-size: 12px; color: var(--dim); gap: 2px; }
  .grid input, .grid select { width: 100%; }
  #photoWrap { position: relative; margin-top: 6px; } #photo { max-width: 100%; display: none; border-radius: 6px; cursor: crosshair; }
  #mark { position: absolute; width: 18px; height: 18px; border: 2px solid #ff4d6d; border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; }
  h4 { margin: 8px 0 4px; font-size: 13px; color: var(--acc); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="top">
  <select id="place" aria-label="מקום"></select>
  <label>שנה <input id="yy" type="number" step="1"></label>
  <label><input id="bce" type="checkbox"> לפנה״ס</label>
  <label>חודש <input id="mm" type="number" min="1" max="12"></label>
  <label>יום <input id="dd" type="number" min="1" max="31"></label>
  <select id="preset" aria-label="רגעים"><option value="">רגעים…</option></select>
  <button id="now">עכשיו</button>
</div>
<div id="panel"><div id="tabs"><button data-t="sky" class="on">שמיים</button><button data-t="zm">זמני היום</button><button data-t="cal">כיול מצלמה</button><button data-t="min">▾</button></div><div class="body" id="pbody"></div></div>
<div id="timebar"><div class="row"><span id="clock">--:--</span><input id="slider" type="range" min="0" max="1439" step="1" aria-label="שעה"><button id="play">▶</button></div><div id="sub"></div></div>
<script src="vendor/three.min.js"></script>
<script src="dist/esh27-sky.js"></script>
<script>
'use strict';
// ---------------------------------------------------------------- mini host: the demo runs the REAL plugin (plugin/15-sky.js) through the same contract as the twin
const REG = []; window.YZW = { register: d => REG.push(d) };
</script>
<script src="plugin/15-sky.js"></script>
<script>
'use strict';
const S = window.ESH27Sky, H = S.hebrew, $ = id => document.getElementById(id), D2R = Math.PI / 180;
const PLACES = [
  { id: 'ashdod', he: 'אשדוד – רח׳ הארז 3', lat: 31.7995, lon: 34.647, elev: 20, tz: 'Asia/Jerusalem' },
  { id: 'temple', he: 'ירושלים – הר הבית', lat: 31.7781, lon: 35.2354, elev: 740, tz: 'Asia/Jerusalem' },
  { id: 'sinai', he: 'הר סיני (ג׳בל מוסא, מסורתי)', lat: 28.5394, lon: 33.9750, elev: 2285, tz: 'Africa/Cairo' },
];
const PRESETS = [
  { he: 'בדיקת המשימה: 22.11.2026 23:00 UTC, אשדוד', place: 'ashdod', utc: [2026, 11, 22, 23, 0], look: 265 },
  { he: 'ליקוי חמה 15.6.763 לפנה״ס (בור-סגלה) – ירושלים', place: 'temple', utc: [-762, 6, 15, 7, 22], look: 75, pitch: 50 },
  { he: 'זריחת הירח 3.4.33 לספירה – ירושלים (ליקוי ירח חלקי לפי החישוב)', place: 'temple', utc: [33, 4, 3, 16, 0], look: 100, pitch: 5 },
  { he: 'הר סיני – בוקר ו׳ בסיוון ב׳תמ״ח (לוח מחושב לאחור)', place: 'sinai', heb: [2448, 3, 6], localMin: 360, look: 90, pitch: 10 },
  { he: 'מולד תשרי ה׳תשפ״ז – ירושלים', place: 'temple', molad: [5787, 7], look: 270, pitch: 5 },
];
const st = { place: PLACES[0], jdDay: 0, min: 0, y: 2026, m: 11, d: 23, yaw: 180, pitch: 20, fov: 75, playing: false, tab: 'sky', useElev: false, lastInfo: 0 };

// ---------------------------------------------------------------- three.js scene
const THREE = window.THREE, canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(st.fov, 1, 0.5, 4000); camera.position.set(0, 0, 0);
const ground = new THREE.Mesh(new THREE.SphereGeometry(1400, 48, 12, 0, Math.PI * 2, Math.PI / 2 + 0.0005, Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x14110c, side: THREE.BackSide, fog: false }));
scene.add(ground);
const hz = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(Array.from({ length: 180 }, (_, i) => new THREE.Vector3(Math.sin(i / 90 * Math.PI) * 1390, 0, -Math.cos(i / 90 * Math.PI) * 1390))), new THREE.LineBasicMaterial({ color: 0x3d4b6a }));
scene.add(hz);
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12), new THREE.MeshBasicMaterial({ color: 0xfff2c0, fog: false })); scene.add(sunMesh);
const world = { THREE, scene, camera, renderer, clock: { date: new Date() }, providers: { gammaDeg: 0 }, weather: { cloud: 0, aqi: 20 }, player: { pos: { x: 0, y: 0, z: 0 } },
  coords: { toITM: () => ({ E: 0, N: 0 }), itmToWgs84: () => ({ lat: st.place.lat, lon: st.place.lon }) } };
const PLUG = REG[0]; let plugGroup = null;
const api = { group: () => { plugGroup = new THREE.Group(); scene.add(plugGroup); return plugGroup; }, on: () => () => {} };
const MAG = +(new URLSearchParams(location.search).get('mag') || 3);
function initPlugin() { if (plugGroup) { PLUG.dispose(world); scene.remove(plugGroup); plugGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); plugGroup = null; } PLUG.init(world, api); const ms = PLUG.settings.find(x => x.id === 'sky.moonScale'); if (ms) ms.set(MAG); }

// ---------------------------------------------------------------- time handling (local date + slider minute → UT)
function tzFor(p, y) { return y >= 1918 ? p.tz : 'lmt'; }
function utcOffsetH(jdUT) { return S.tzOffsetHours(jdUT, tzFor(st.place, S.calendarFromJd(jdUT).y), st.place.lon); }
function currentJdUT() { const j0 = S.jdFromCalendar(st.y, st.m, st.d, 'auto') + st.min / 1440; let off = utcOffsetH(j0); off = utcOffsetH(j0 - off / 24); return j0 - off / 24; }
function setFromJdUT(jdUT) { const off = utcOffsetH(jdUT), c = S.calendarFromJd(jdUT + off / 24); st.y = c.y; st.m = c.m; st.d = c.d; st.min = c.h * 60 + c.mi; syncInputs(); refreshDay(); world.clock.date = S.dateFromJd(currentJdUT()); }
function syncInputs() { $('yy').value = st.y <= 0 ? 1 - st.y : st.y; $('bce').checked = st.y <= 0; $('mm').value = st.m; $('dd').value = st.d; $('slider').value = st.min; }
function readInputs() { const yv = Math.max(1, +$('yy').value || 1); st.y = $('bce').checked ? 1 - yv : yv; st.m = Math.min(12, Math.max(1, +$('mm').value || 1)); st.d = Math.min(31, Math.max(1, +$('dd').value || 1)); refreshDay(); }
let DAY = null;
function refreshDay() {
  const p = st.place, z = S.zmanim(st.y, st.m, st.d, p.lat, p.lon, { elev: p.elev, useElevation: st.useElev, tz: tzFor(p, st.y) });
  const j0 = S.jdFromCalendar(st.y, st.m, st.d, 'auto') - z.utcOffsetHours / 24;
  const mr = S.riseSet('Moon', j0, p.lat, p.lon), sr = S.riseSet('Sun', j0, p.lat, p.lon);
  const hd = H.hebrewDate(j0 + 0.5, { tzHours: z.utcOffsetHours });
  const mol = H.molad(hd.y, hd.m), conj = S.nextMoonPhase(mol.jdUT - 3, 0);
  DAY = { z, mr, sr, hd, mol, conj, j0 };
}

// ---------------------------------------------------------------- view: drag / pinch / wheel
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw: st.yaw, pitch: st.pitch }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; const k = st.fov / innerHeight; st.yaw = drag.yaw - (e.clientX - drag.x) * k; st.pitch = Math.max(-10, Math.min(89, drag.pitch + (e.clientY - drag.y) * k)); });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', e => { st.fov = Math.max(15, Math.min(110, st.fov * (e.deltaY > 0 ? 1.08 : 0.93))); e.preventDefault(); }, { passive: false });
function resize() { document.documentElement.style.setProperty('--topH', ($('top').offsetHeight + 6) + 'px'); renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

// ---------------------------------------------------------------- labels
const labels = $('labels'), LB = new Map();
function label(key, text, cls, v) {
  let el = LB.get(key); if (!el) { el = document.createElement('div'); el.className = 'lb ' + (cls || ''); labels.appendChild(el); LB.set(key, el); }
  const p = new THREE.Vector3(v.x, v.y, v.z).multiplyScalar(1000).project(camera);
  const vis = p.z < 1 && p.z > -1 && Math.abs(p.x) < 1.1 && Math.abs(p.y) < 1.1 && v.y > -0.02;
  el.style.display = vis ? '' : 'none'; if (!vis) return;
  el.textContent = text; el.style.left = ((p.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - p.y) / 2 * innerHeight) + 'px';
}
const CARD = [['צ', 0], ['מז', 90], ['ד', 180], ['מע', 270], ['צמ', 45], ['דמ', 135], ['דמע', 225], ['צמע', 315]];
const BRIGHT = new Set(['Sirius', 'Canopus', 'Arcturus', 'Vega', 'Capella', 'Rigel', 'Procyon', 'Betelgeuse', 'Altair', 'Aldebaran', 'Antares', 'Spica', 'Pollux', 'Fomalhaut', 'Deneb', 'Regulus', 'Polaris', 'Castor', 'Bellatrix', 'Alnilam']);

// ---------------------------------------------------------------- panel
const fmt = (x, n = 1) => (x == null || !isFinite(x) ? '—' : x.toFixed(n));
const hhmm = jd => (jd == null ? '—' : S.fmtLocal(jd, tzFor(st.place, st.y), st.place.lon).slice(0, 5));
function skyTab(sky) {
  const b = sky.bodies, mn = b.Moon, sun = b.Sun, c = sky.ctx, D = DAY, cal = S.calendarFromJd(c.jdUT);
  const rows = ['Sun', 'Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn'].map(n => { const x = b[n]; return `<tr><td>${S.PLANET_HE[n]}</td><td class="n">${fmt(x.az)}°</td><td class="n">${fmt(x.altApparent)}°</td><td class="n">${n === 'Sun' ? '' : fmt(x.phase * 100, 0) + '%'}</td></tr>`; }).join('');
  const sv = sun.vec, gam = S.itmConvergenceDeg(st.place.lat, st.place.lon);
  const dTh = c.deltaT / 3600, sig = c.deltaTSigma;
  return `<div><b>${D.hd.text}</b> · יום ${H.DAYS_HE[D.hd.dow]}</div>
  <div class="note">${cal.cal === 'julian' ? 'לוח יוליאני' : 'לוח גרגוריאני'} · UT ${cal.y <= 0 ? (1 - cal.y) + ' לפנה״ס' : cal.y}-${cal.m}-${cal.d} ${String(cal.h).padStart(2, '0')}:${String(cal.mi).padStart(2, '0')} · אזור זמן: ${tzFor(st.place, st.y) === 'lmt' ? 'זמן שמש ממוצע מקומי' : tzFor(st.place, st.y)}</div>
  <table><tr><th>גוף</th><th>אזימוט</th><th>גובה</th><th>מואר</th></tr>${rows}</table>
  <h4>ירח</h4><div>${mn.waxing ? 'מתמלא' : 'מתמעט'} · ${fmt(mn.phase * 100, 1)}% מואר · זריחה ${hhmm(D.mr.rise)} · שקיעה ${hhmm(D.mr.set)}</div>
  <h4>שמש (וקטור לעולם התאום)</h4><div class="n" style="direction:ltr;text-align:start">x=${fmt(sv.x, 4)} y=${fmt(sv.y, 4)} z=${fmt(sv.z, 4)} · γ(ITM)=${fmt(gam, 3)}°</div>
  <div>זריחה ${hhmm(D.sr.rise)} · צהריים ${hhmm(D.sr.transit)} · שקיעה ${hhmm(D.sr.set)}</div>
  <h4>מולד ${H.monthName(D.mol.m, D.mol.y)}</h4><div>${D.mol.text}</div><div class="note">המולד הממוצע לעומת ההתקבצות האסטרונומית: ${D.conj ? fmt((D.conj - D.mol.jdUT) * 24, 1) + ' שעות' : '—'}</div>
  <h4>ΔT (זמן כדור הארץ)</h4><div>${Math.abs(dTh) >= 1 ? fmt(dTh, 2) + ' שעות' : fmt(c.deltaT, 1) + ' שנ׳'} · אי-ודאות ±${sig >= 120 ? fmt(sig / 60, 0) + ' דק׳' : fmt(sig, 1) + ' שנ׳'}</div>
  ${sig >= 60 ? `<div class="note warn">בשנה זו אי-הוודאות בסיבוב כדור הארץ מסובבת את כל השמיים סביב הקוטב בכ-±${fmt(sig * 15 / 3600, 1)}° — זמני זריחה/שקיעה זזים ±${fmt(sig / 60, 0)} דק׳. צורת השמיים (ירח מול כוכבים) לא מושפעת.</div>` : ''}
  ${st.y < 360 ? '<div class="note warn">הלוח העברי הקבוע (המולד והדחיות) לא היה בשימוש בתקופה זו; החודשים נקבעו על פי ראיית הירח. התאריך העברי כאן הוא חישוב לאחור בלבד.</div>' : ''}
  <div class="note">מקורות: VSOP87D, מאוס פרק 47, קטלוג ייל BSC5. דיוק נמדד: ירח ≤ 8″, כוכבי לכת ≤ 7″ מול JPL DE421.</div>`;
}
function zmTab() {
  const z = DAY.z; return `<label><input type="checkbox" id="useElev" ${st.useElev ? 'checked' : ''}> אופק נראה לפי גובה (${st.place.elev} מ׳)</label>
  <table>${z.list.map(r => `<tr><td>${r.he}</td><td class="n">${r.local}</td></tr>`).join('')}</table>
  <div class="note">שעה זמנית (גר״א): ${fmt(z.shaahZmanitGRA, 2)} דק׳ · מג״א 72: ${fmt(z.shaahZmanitMGA72, 2)} דק׳</div>
  <div class="note">אומת: מול python zmanim (KosherJava) ≤ 4 שנ׳ ב-240 ימים×מקומות; מול hebcal.com לדקה. חישוב בלבד, לא פסק הלכה.</div>`;
}
function calTab() {
  return `<div class="note">צלמו את הירח/השמש, הזינו את שעת הצילום (המקום והזמן שבסרגל), את גודל התמונה, את שדה הראייה ואת מיקום הגוף בפיקסלים — או טענו תמונה ולחצו על הגוף.</div>
  <div class="grid">
   <label>גוף<select id="cBody"><option>Moon</option><option>Sun</option><option>Venus</option><option>Jupiter</option><option>Saturn</option><option>Mars</option><option>Sirius</option><option>Vega</option><option>Arcturus</option></select></label>
   <label>אורך מוקד שווה-ערך 35 מ״מ<input id="cF35" type="number" value="26"></label>
   <label>רוחב תמונה (פיקסלים)<input id="cW" type="number" value="4000"></label><label>גובה תמונה<input id="cH" type="number" value="3000"></label>
   <label>u – פיקסלים מהקצה השמאלי<input id="cU" type="number" value="2000"></label><label>v – פיקסלים מהקצה העליון<input id="cV" type="number" value="1500"></label>
   <label>הטיה ידועה (roll, °)<input id="cRoll" type="number" value="0"></label><label>טעינת תמונה<input id="cFile" type="file" accept="image/*"></label>
  </div>
  <div id="photoWrap"><img id="photo" alt="תמונה לכיול"><div id="mark"></div></div>
  <button id="cGo" style="margin-top:6px">חשב כיוון מצלמה</button><div id="cOut" style="margin-top:6px"></div>`;
}
function renderPanel() {
  SKY = world.providers.sky; if (SKY && !SKY.bodies.Sun) SKY.update(world.clock.date, 7);
  const b = $('pbody'); if (st.tab === 'sky') b.innerHTML = skyTab(SKY); else if (st.tab === 'zm') b.innerHTML = zmTab(); else b.innerHTML = calTab();
  if (st.tab === 'zm') $('useElev').onchange = e => { st.useElev = e.target.checked; refreshDay(); renderPanel(); };
  if (st.tab === 'cal') wireCal();
}
function wireCal() {
  const img = $('photo'), mark = $('mark');
  $('cFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const url = URL.createObjectURL(f); img.onload = () => { $('cW').value = img.naturalWidth; $('cH').value = img.naturalHeight; img.style.display = 'block'; }; img.src = url; };
  img.onclick = e => { const r = img.getBoundingClientRect(), u = (e.clientX - r.left) / r.width * img.naturalWidth, v = (e.clientY - r.top) / r.height * img.naturalHeight; $('cU').value = Math.round(u); $('cV').value = Math.round(v); mark.style.display = 'block'; mark.style.left = (e.clientX - r.left) + 'px'; mark.style.top = (e.clientY - r.top) + 'px'; };
  $('cGo').onclick = () => {
    try {
      const W = +$('cW').value, Hh = +$('cH').value, f35 = +$('cF35').value, hfov = 2 * Math.atan(36 / (2 * f35)) / D2R;
      const gam = S.itmConvergenceDeg(st.place.lat, st.place.lon);
      const r = S.calibrateFromPhoto({ date: S.dateFromJd(currentJdUT()), lat: st.place.lat, lon: st.place.lon, elev: st.place.elev, W, H: Hh, fovDeg: hfov, roll: +$('cRoll').value, marks: [{ body: $('cBody').value, u: +$('cU').value, v: +$('cV').value }], gammaDeg: gam });
      const bd = r.bodies[0];
      $('cOut').innerHTML = `<div><b>כיוון המצלמה (מרכז התמונה): ${fmt(r.heading, 2)}° מצפון אמיתי</b></div><div>ברשת ישראל (ITM): ${fmt(r.headingGrid, 2)}° · הגבהה ${fmt(r.pitch, 2)}°</div>
        <div class="note">הגוף: אזימוט ${fmt(bd.az, 2)}°, גובה ${fmt(bd.alt, 2)}° · שדה ראייה אופקי ${fmt(hfov, 1)}° · אי-ודאות ±${fmt(r.sigmaHeading, 2)}° לכל 3 פיקסלים שגיאת סימון (ללא עיוות עדשה)</div>`;
      window.__calib = r;
    } catch (e) { $('cOut').innerHTML = `<span class="warn">${e.message}</span>`; }
  };
}
$('tabs').onclick = e => { const t = e.target.dataset.t; if (!t) return; if (t === 'min') { $('panel').classList.toggle('min'); return; } st.tab = t; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); renderPanel(); };

// ---------------------------------------------------------------- controls
for (const p of PLACES) $('place').add(new Option(p.he, p.id));
PRESETS.forEach((p, i) => $('preset').add(new Option(p.he, String(i))));
$('place').onchange = e => { st.place = PLACES.find(p => p.id === e.target.value); const jd = currentJdUT(); initPlugin(); setFromJdUT(jd); renderPanel(); };
for (const id of ['yy', 'mm', 'dd', 'bce']) $(id).onchange = () => { readInputs(); renderPanel(); };
$('slider').oninput = e => { st.min = +e.target.value; };
$('slider').onchange = () => renderPanel();
$('now').onclick = () => { setFromJdUT(S.jdFromDate(Date.now())); renderPanel(); };
$('play').onclick = () => { st.playing = !st.playing; $('play').textContent = st.playing ? '❚❚' : '▶'; };
$('preset').onchange = e => { const p = PRESETS[+e.target.value]; if (!p) return; applyPreset(p); e.target.value = ''; };
function applyPreset(p) {
  st.place = PLACES.find(x => x.id === p.place); $('place').value = st.place.id; initPlugin();
  if (p.utc) { const [y, m, d, h, mi] = p.utc; setFromJdUT(S.jdFromCalendar(y, m, d, 'auto') + (h * 60 + mi) / 1440); }
  else if (p.heb) { const jd = H.jdFromRd(H.rdFromHebrew(...p.heb)); const c = S.calendarFromJd(jd); st.y = c.y; st.m = c.m; st.d = c.d; st.min = p.localMin; syncInputs(); refreshDay(); }
  else if (p.molad) { setFromJdUT(H.molad(...p.molad).jdUT); }
  if (p.look != null) st.yaw = p.look; if (p.pitch != null) st.pitch = p.pitch;
  renderPanel();
}

// ---------------------------------------------------------------- frame
let SKY = null, last = performance.now(), frameMs = 0; const FT = [];
function obscuration(sun, moon) {   // fraction of the solar disc covered (area of overlap of two discs)
  const d = S.angSep(sun.ra, sun.dec, moon.ra, moon.dec), r1 = 0.2666, r2 = moon.semidiameter || 0.25; if (d >= r1 + r2) return 0; if (d <= Math.abs(r2 - r1)) return r2 >= r1 ? 1 : (r2 * r2) / (r1 * r1);
  const a = Math.acos((d * d + r1 * r1 - r2 * r2) / (2 * d * r1)), b = Math.acos((d * d + r2 * r2 - r1 * r1) / (2 * d * r2));
  return (r1 * r1 * (a - Math.sin(2 * a) / 2) + r2 * r2 * (b - Math.sin(2 * b) / 2)) / (Math.PI * r1 * r1); }
function skyColor(alt) { const day = new THREE.Color(0x3d6fb5), tw = new THREE.Color(0x3b3a62), night = new THREE.Color(0x03050c);
  if (alt > 0) return day.clone().lerp(new THREE.Color(0x6a7fa8), Math.max(0, 1 - alt / 10) * 0.5);
  if (alt > -6) return tw.clone().lerp(day, (alt + 6) / 6); if (alt > -18) return night.clone().lerp(tw, (alt + 18) / 12); return night; }
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (st.playing) { st.min += dt * 10; if (st.min >= 1440) { st.min -= 1440; const jd = currentJdUT() ; setFromJdUT(jd); } $('slider').value = Math.floor(st.min); }
  world.clock.date = S.dateFromJd(currentJdUT());
  const t0 = performance.now(); PLUG.update(dt, world); FT.push(performance.now() - t0); if (FT.length > 120) FT.shift(); frameMs = FT.slice().sort((a, b) => a - b)[FT.length >> 1];
  SKY = world.providers.sky; const sun = SKY.bodies.Sun;
  // camera
  const y = st.yaw * D2R, p = st.pitch * D2R; camera.fov = st.fov; camera.updateProjectionMatrix();
  camera.lookAt(Math.cos(p) * Math.sin(y), Math.sin(p), -Math.cos(p) * Math.cos(y));
  const obs = obscuration(sun, SKY.bodies.Moon); scene.background = skyColor(sun.altApparent).lerp(new THREE.Color(0x05070f), Math.pow(obs, 6));
  const sv = sun.vec, rs = 1490, sd = Math.tan(0.2666 * D2R) * rs; sunMesh.position.set(sv.x * rs, sv.y * rs, sv.z * rs); sunMesh.scale.setScalar(sd * MAG * 0.98); sunMesh.visible = sun.altApparent > -1;
  renderer.render(scene, camera);
  // labels
  for (const [t, a] of CARD) label('c' + t, t, 'card', S.twinVector(0.5, a, 0));
  const F = SKY.stars, M = SKY.matrix;
  const starLbl = sun.altApparent < -6, planetLbl = sun.altApparent < -3;
  for (let i = 0; i < F.n; i++) { const nm = F.names[i]; if (!BRIGHT.has(nm)) continue; if (!starLbl) { const el = LB.get('s' + i); if (el) el.style.display = 'none'; continue; } const e = [F.eq[i * 3], F.eq[i * 3 + 1], F.eq[i * 3 + 2]];
    label('s' + i, F.namesHe[i], '', { x: M[0] * e[0] + M[1] * e[1] + M[2] * e[2], y: M[3] * e[0] + M[4] * e[1] + M[5] * e[2], z: M[6] * e[0] + M[7] * e[1] + M[8] * e[2] }); }
  for (const n of ['Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn']) { if (planetLbl || (n === 'Venus' && SKY.bodies[n].altApparent > 0)) label('p' + n, S.PLANET_HE[n], 'pl', SKY.bodies[n].vec); else { const el = LB.get('p' + n); if (el) el.style.display = 'none'; } }
  label('moon', 'ירח ' + Math.round(SKY.bodies.Moon.phase * 100) + '%', 'mn', SKY.bodies.Moon.vec);
  label('sun', 'שמש', 'sn', sun.vec);
  const loc = S.fmtLocal(SKY.ctx.jdUT, tzFor(st.place, st.y), st.place.lon); $('clock').textContent = loc.slice(0, 5);
  $('sub').textContent = `${st.place.he} · שמש ${fmt(sun.altApparent)}° / ${fmt(sun.az)}° · ${DAY.hd.text} · ${obs > 0.001 ? 'ליקוי: ' + (obs * 100).toFixed(0) + '% מהשמש מכוסה · ' : ''}חישוב השמיים (חציון) ${(frameMs * 1000).toFixed(0)} µs/פריים${MAG !== 1 ? ' · ירח ושמש מוגדלים ×' + MAG : ''}`;
  if (st.tab === 'sky' && now - st.lastInfo > 500) { st.lastInfo = now; if (!document.activeElement || !$('pbody').contains(document.activeElement)) $('pbody').innerHTML = skyTab(SKY); }
  window.__state = { obscuration: obs, sun: { az: sun.az, alt: sun.altApparent }, moon: { az: SKY.bodies.Moon.az, alt: SKY.bodies.Moon.altApparent, phase: SKY.bodies.Moon.phase }, frameMs, hebrew: DAY.hd.text, place: st.place.id, y: st.y };
  requestAnimationFrame(frame);
}
// ---------------------------------------------------------------- start (query: ?preset=N | ?utc=YYYY-MM-DDTHH:MM&place=id&yaw=&pitch=&tab=)
const Q = new URLSearchParams(location.search);
resize(); initPlugin();
if (Q.get('place')) { st.place = PLACES.find(p => p.id === Q.get('place')) || PLACES[0]; $('place').value = st.place.id; initPlugin(); }
if (Q.get('utc')) { const m = Q.get('utc').match(/^(-?\d+)-(\d+)-(\d+)T(\d+):(\d+)/); setFromJdUT(S.jdFromCalendar(+m[1], +m[2], +m[3], 'auto') + (+m[4] * 60 + +m[5]) / 1440); } else setFromJdUT(S.jdFromDate(Date.now()));
if (Q.get('preset') != null) applyPreset(PRESETS[+Q.get('preset')]);
if (Q.get('yaw')) st.yaw = +Q.get('yaw'); if (Q.get('pitch')) st.pitch = +Q.get('pitch'); if (Q.get('fov')) st.fov = +Q.get('fov');
if (Q.get('min')) $('panel').classList.add('min');
if (Q.get('tab')) { st.tab = Q.get('tab'); document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === st.tab)); }
renderPanel(); requestAnimationFrame(frame); window.__ready = true;
</script>
