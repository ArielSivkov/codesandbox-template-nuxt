# The continuous all-Israel process: every night build the next cities from the queue
# (and refresh stale ones), upload the tiles to Cloudflare R2, commit progress.json.
# Place this file at  <repo>/.github/workflows/yazam-israel.yml  and the pipeline at <repo>/pipeline/
name: yazam-israel-map

on:
  schedule:
    - cron: "17 1 * * *"          # 01:17 UTC nightly (Geofabrik publishes a new Israel extract daily)
  workflow_dispatch:
    inputs:
      only:
        description: "force cities (comma separated slugs, e.g. ashdod,ramla). Empty = queue"
        required: false
      max_cities:
        description: "how many cities this run"
        required: false
        default: "2"

permissions:
  contents: write                  # to commit progress.json

concurrency:
  group: yazam-israel-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: pipeline
    env:
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      BUCKET: ${{ vars.R2_BUCKET || 'yazam-map' }}
      EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
      OVERTURE_RELEASE: ${{ vars.OVERTURE_RELEASE }}   # pin a release, e.g. 2026-10-22.0 (empty = latest)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool   # aws CLI v2 is preinstalled on GitHub runners
          pip install -r requirements.txt pytest

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Today's Geofabrik extract (cached per day)
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: osm-dem-${{ steps.day.outputs.d }}
          restore-keys: osm-dem-
      - name: Download OSM
        run: |
          mkdir -p .cache
          curl -fsSL -z .cache/israel.osm.pbf -o .cache/israel.osm.pbf \
            https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf
          ls -lh .cache/israel.osm.pbf

      - name: Pull contractor corrections (data flywheel)
        if: env.EXPORT_TOKEN != ''
        run: |
          curl -fsS -H "Authorization: Bearer $EXPORT_TOKEN" \
            "https://yazam.esh27.com/map-data/api/corrections/export" -o .cache/corrections.json || echo "[]" > .cache/corrections.json

      - name: Pull existing tiles (shared tiles are merged, not overwritten)
        run: |
          mkdir -p out
          aws s3 sync "s3://$BUCKET/" out/ --endpoint-url "$R2_ENDPOINT" --exclude "corrections/*" --only-show-errors || true

      - name: Build next cities
        run: |
          ARGS="--osm pbf --pbf .cache/israel.osm.pbf --dem cop30 --overture --out out"
          [ -f .cache/corrections.json ] && ARGS="$ARGS --measurements .cache/corrections.json"
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python run_queue.py --only "${{ github.event.inputs.only }}" $ARGS
          else
            python run_queue.py --max-cities "${{ github.event.inputs.max_cities || '2' }}" $ARGS
          fi

      - name: Upload tiles to R2
        if: always()
        run: |
          aws s3 sync out/ "s3://$BUCKET/" --endpoint-url "$R2_ENDPOINT" --exclude "corrections/*" --only-show-errors
          python run_queue.py --status

      - name: Commit progress manifest
        if: always()
        run: |
          git config user.name "yazam-bot"
          git config user.email "yazam-bot@users.noreply.github.com"
          git add progress.json
          git diff --cached --quiet || git commit -m "map progress $(date -u +%F)"
          git push
